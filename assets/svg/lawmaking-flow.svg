<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="t d" style="max-width:100%;height:auto;background:#fffdf7;border:1px solid #e7dcc4;border-radius:12px">
<title id="t">How a bill becomes law</title>
<desc id="d">Flowchart of the legislative process in Parliament: introduction, Lok Sabha, Rajya Sabha, President's assent, Act.</desc>
<defs>
<marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1e2a44"/></marker>
</defs>
<text x="320" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1e2a44">How a Bill Becomes Law</text>
<g font-family="system-ui,sans-serif" font-size="13.5">
<rect x="200" y="56" width="240" height="50" rx="10" fill="#1e2a44"/>
<text x="320" y="86" text-anchor="middle" fill="#fff" font-weight="600">Bill introduced (Art. 107)</text>
<line x1="320" y1="106" x2="320" y2="126" stroke="#1e2a44" stroke-width="2" marker-end="url(#ar2)"/>

<rect x="60" y="126" width="240" height="86" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/>
<text x="180" y="150" text-anchor="middle" fill="#1e2a44" font-weight="700">Lok Sabha</text>
<text x="180" y="172" text-anchor="middle" fill="#5a5a5a" font-size="12.5">1st reading → committee →</text>
<text x="180" y="190" text-anchor="middle" fill="#5a5a5a" font-size="12.5">2nd &amp; 3rd reading → passed</text>

<rect x="340" y="126" width="240" height="86" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/>
<text x="460" y="150" text-anchor="middle" fill="#1e2a44" font-weight="700">Rajya Sabha</text>
<text x="460" y="172" text-anchor="middle" fill="#5a5a5a" font-size="12.5">same 3 readings → passed</text>
<text x="460" y="190" text-anchor="middle" fill="#5a5a5a" font-size="12.5">(Art. 108: joint sitting if deadlock)</text>
<line x1="300" y1="169" x2="336" y2="169" stroke="#1e2a44" stroke-width="2" marker-end="url(#ar2)"/>

<line x1="460" y1="212" x2="460" y2="236" stroke="#1e2a44" stroke-width="2" marker-end="url(#ar2)"/>
<rect x="340" y="236" width="240" height="66" rx="10" fill="#fdf0d5" stroke="#f59e0b" stroke-width="2"/>
<text x="460" y="260" text-anchor="middle" fill="#1e2a44" font-weight="700">President (Art. 111)</text>
<text x="460" y="282" text-anchor="middle" fill="#5a4a2f" font-size="12.5">assent · withhold · return once</text>
<line x1="460" y1="302" x2="460" y2="326" stroke="#1e2a44" stroke-width="2" marker-end="url(#ar2)"/>

<rect x="200" y="326" width="240" height="50" rx="10" fill="#2e7d32"/>
<text x="320" y="357" text-anchor="middle" fill="#fff" font-weight="700">Becomes an ACT of Parliament</text>

<rect x="60" y="236" width="240" height="140" rx="10" fill="#fff7e6" stroke="#c98a12" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="180" y="260" text-anchor="middle" fill="#8a5c00" font-weight="700">Money Bill shortcut (Art. 110)</text>
<text x="180" y="284" text-anchor="middle" fill="#8a5c00" font-size="12.5">Lok Sabha only; Rajya Sabha</text>
<text x="180" y="304" text-anchor="middle" fill="#8a5c00" font-size="12.5">may only recommend (14 days);</text>
<text x="180" y="324" text-anchor="middle" fill="#8a5c00" font-size="12.5">Speaker certifies; President</text>
<text x="180" y="344" text-anchor="middle" fill="#8a5c00" font-size="12.5">cannot return a Money Bill</text>
<text x="320" y="412" text-anchor="middle" fill="#777" font-size="12.5">In the exam: draw this in ~90 seconds for any "legislative process" question.</text>
</g>
</svg>
