<title id="t">Rivers of Bihar schematic</title>
<desc id="d">Schematic map: the Ganga flows west to east across Bihar; northern tributaries Gandak, Burhi Gandak, Bagmati, Kosi and Mahananda join from the north, Son, Punpun and Falgu from the south.</desc>
