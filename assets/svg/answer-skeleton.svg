<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="t d" style="max-width:100%;height:auto;background:#fffdf7;border:1px solid #e7dcc4;border-radius:12px">
<title id="t">IBC answer skeleton</title>
<desc id="d">Flowchart: question demand, introduction, body with dimensions, visual element, conclusion.</desc>
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1e2a44"/></marker>
</defs>
<text x="320" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#1e2a44">The IBC Answer Skeleton</text>

<g font-family="system-ui,sans-serif" font-size="14">
<rect x="120" y="56" width="400" height="52" rx="10" fill="#1e2a44"/>
<text x="320" y="87" text-anchor="middle" fill="#ffffff" font-weight="600">Decode the demand: discuss / analyse / evaluate / comment</text>
<line x1="320" y1="108" x2="320" y2="128" stroke="#1e2a44" stroke-width="2" marker-end="url(#ar)"/>

<rect x="90" y="128" width="460" height="72" rx="10" fill="#fdf0d5" stroke="#f59e0b" stroke-width="2"/>
<text x="320" y="153" text-anchor="middle" fill="#1e2a44" font-weight="700">INTRO (2–3 lines)</text>
<text x="320" y="176" text-anchor="middle" fill="#5a4a2f" font-size="13">definition · striking fact · constitutional hook · current-affairs link</text>
<line x1="320" y1="200" x2="320" y2="220" stroke="#1e2a44" stroke-width="2" marker-end="url(#ar)"/>

<rect x="90" y="220" width="460" height="120" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/>
<text x="320" y="245" text-anchor="middle" fill="#1e2a44" font-weight="700">BODY — 4 to 6 sub-headed dimensions</text>
<g font-size="12">
<rect x="110" y="258" width="100" height="30" rx="8" fill="#eef3ff" stroke="#1e2a44"/><text x="160" y="278" text-anchor="middle" fill="#1e2a44">Economic</text>
<rect x="222" y="258" width="100" height="30" rx="8" fill="#eef3ff" stroke="#1e2a44"/><text x="272" y="278" text-anchor="middle" fill="#1e2a44">Social</text>
<rect x="334" y="258" width="100" height="30" rx="8" fill="#eef3ff" stroke="#1e2a44"/><text x="384" y="278" text-anchor="middle" fill="#1e2a44">Political</text>
<rect x="166" y="296" width="110" height="30" rx="8" fill="#eef3ff" stroke="#1e2a44"/><text x="221" y="316" text-anchor="middle" fill="#1e2a44">Environment</text>
<rect x="288" y="296" width="110" height="30" rx="8" fill="#eef3ff" stroke="#1e2a44"/><text x="343" y="316" text-anchor="middle" fill="#1e2a44">Governance</text>
</g>
<line x1="320" y1="340" x2="320" y2="360" stroke="#1e2a44" stroke-width="2" marker-end="url(#ar)"/>

<rect x="90" y="360" width="460" height="66" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="320" y="384" text-anchor="middle" fill="#1b3a1f" font-weight="700">VISUAL (where it helps)</text>
<text x="320" y="406" text-anchor="middle" fill="#2e5b34" font-size="13">flowchart · map · timeline · table — one per answer, max</text>
<line x1="320" y1="426" x2="320" y2="446" stroke="#1e2a44" stroke-width="2" marker-end="url(#ar)"/>

<rect x="90" y="446" width="460" height="72" rx="10" fill="#fdf0d5" stroke="#f59e0b" stroke-width="2"/>
<text x="320" y="471" text-anchor="middle" fill="#1e2a44" font-weight="700">CONCLUSION (2–3 lines)</text>
<text x="320" y="494" text-anchor="middle" fill="#5a4a2f" font-size="13">balanced verdict · way forward · optimistic, constitutional tone</text>

<rect x="90" y="536" width="460" height="44" rx="10" fill="#1e2a44"/>
<text x="320" y="563" text-anchor="middle" fill="#ffd97a" font-size="13" font-weight="600">Underline keywords · data + article + scheme in the body</text>
</g>
</svg>
